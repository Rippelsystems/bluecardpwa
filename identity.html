<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <title>Blue Card — RLL Build Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=DM+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f0f0f0; color: #111; }

    .topbar { background: #1a1a2e; }
    .topbar .title, .topbar .operator-tag { color: #fff; }
    .card-badge { background: #1a6cf0; color: #fff; }

    .card-title {
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      border-bottom: 2px solid #333;
      background: #fff;
      color: #111;
      text-transform: uppercase;
    }

    /* ── TWO COLUMN GRID ── */
    .card-body {
      background: #fff;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Logo bar — simple single row, no spanning */
    .logo-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 12px;
      border-bottom: 1px solid #ccc;
      background: #fff;
    }
    .logo-text {
      font-size: 16px;
      font-weight: 800;
      color: #1a6cf0;
      letter-spacing: -0.02em;
    }
    .logo-text span {
      color: #666;
      font-weight: 400;
      font-size: 10px;
      display: block;
      letter-spacing: 0.1em;
      text-align: right;
    }

    /* Each row = two cells side by side */
    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #ccc;
    }
    .card-row.single { grid-template-columns: 1fr; }

    .cell {
      padding: 7px 10px;
      border-right: 1px solid #ccc;
    }
    .cell:last-child { border-right: none; }

    .cell label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 4px;
    }
    .cell label.yellow { color: #b8860b; }

    /* Inputs */
    .cell input[type="text"],
    .cell select {
      width: 100%;
      border: none;
      border-bottom: 1px solid #aaa;
      background: transparent;
      color: #111;
      font-size: 13px;
      font-family: 'DM Mono', monospace;
      padding: 3px 2px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .cell input[type="text"]:focus,
    .cell select:focus { border-bottom-color: #1a6cf0; }

    /* Make select text black */
    .cell select { color: #111 !important; background: #fff; }
    .cell select option { color: #111; background: #fff; }

    /* Narrow trolley dropdowns */
    .cell.narrow { max-width: 120px; }

    /* Serial row with camera button */
    .serial-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .serial-row input { flex: 1; }

    .cam-btn {
      background: #e8f0fe;
      border: 1px solid #1a6cf0;
      border-radius: 5px;
      color: #1a6cf0;
      font-size: 15px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    .cam-btn:active { background: #1a6cf0; color: #fff; }

    .serial-thumb {
      width: 28px;
      height: 28px;
      border-radius: 3px;
      object-fit: cover;
      display: none;
      border: 1px solid #1a6cf0;
      flex-shrink: 0;
    }

    /* OCR status */
    .ocr-status {
      font-size: 11px;
      color: #666;
      text-align: center;
      padding: 6px;
      background: #f9f9f9;
      border-top: 1px solid #ddd;
    }

    /* Action bar */
    .action-bar {
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 2px solid #1a6cf0;
      padding: 10px 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary { background: #1a6cf0; color: #fff; }
    .btn-primary:active { opacity: 0.85; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e3354;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.25s ease;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.visible { transform: translateX(-50%) translateY(0); }
    #toast.ok    { border: 1px solid #1db96a; }
    #toast.warn  { border: 1px solid #e08f1a; }
    #toast.error { border: 1px solid #e03c3c; }
  </style>
</head>
<body>

<div class="topbar">
  <span class="card-badge">RLL</span>
  <span class="title">Build History Card</span>
  <span class="operator-tag" id="top-operator">OP —</span>
</div>

<div class="card-title">RLL 37/38 Build History Card</div>

<div class="card-body">

  <!-- Logo bar -->
  <div class="logo-bar">
    <div class="logo-text">Rippel<span>effect</span></div>
  </div>

  <!-- Row: Trolley No | Trolley Position -->
  <div class="card-row">
    <div class="cell">
      <label>Trolley No</label>
      <select id="inp-trolley-no" onchange="handleTrolleyChange()"></select>
    </div>
    <div class="cell">
      <label>Trolley Position</label>
      <select id="inp-trolley-pos"></select>
    </div>
  </div>

  <!-- Row: Launcher Serial | Barrel No -->
  <div class="card-row">
    <div class="cell">
      <label class="yellow">Launcher Serial No</label>
      <div class="serial-row">
        <input type="text" id="inp-launcher-serial" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-launcher-serial">
        <button class="cam-btn" onclick="captureSerial('inp-launcher-serial','photo_launcher')">📷</button>
      </div>
    </div>
    <div class="cell">
      <label class="yellow">Barrel No</label>
      <div class="serial-row">
        <input type="text" id="inp-barrel-no" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-barrel-no">
        <button class="cam-btn" onclick="captureSerial('inp-barrel-no','photo_barrel')">📷</button>
      </div>
    </div>
  </div>

  <!-- Row: Year of Manufacturing | Barrel Production No -->
  <div class="card-row">
    <div class="cell">
      <label>Year of Manufacturing</label>
      <select id="inp-year"></select>
    </div>
    <div class="cell">
      <label class="yellow">Barrel Production No</label>
      <div class="serial-row">
        <input type="text" id="inp-barrel-prod-no" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-barrel-prod-no">
        <button class="cam-btn" onclick="captureSerial('inp-barrel-prod-no','photo_barrel_prod')">📷</button>
      </div>
    </div>
  </div>

  <!-- Row: Client/Country | HRC Serial No -->
  <div class="card-row">
    <div class="cell">
      <label>Client / Country</label>
      <select id="inp-customer"></select>
    </div>
    <div class="cell">
      <label class="yellow">HRC Serial No</label>
      <div class="serial-row">
        <input type="text" id="inp-hrc-serial" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-hrc-serial">
        <button class="cam-btn" onclick="captureSerial('inp-hrc-serial','photo_hrc')">📷</button>
      </div>
    </div>
  </div>

  <!-- Row: Cylinder No | Firing Mech No -->
  <div class="card-row">
    <div class="cell">
      <label class="yellow">Cylinder No</label>
      <div class="serial-row">
        <input type="text" id="inp-cylinder-no" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-cylinder-no">
        <button class="cam-btn" onclick="captureSerial('inp-cylinder-no','photo_cylinder')">📷</button>
      </div>
    </div>
    <div class="cell">
      <label class="yellow">Firing Mech No</label>
      <div class="serial-row">
        <input type="text" id="inp-firing-mech" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-firing-mech">
        <button class="cam-btn" onclick="captureSerial('inp-firing-mech','photo_firing_mech')">📷</button>
      </div>
    </div>
  </div>

  <!-- Row: Cylinder Production No | (empty) -->
  <div class="card-row">
    <div class="cell">
      <label class="yellow">Cylinder Production No</label>
      <div class="serial-row">
        <input type="text" id="inp-cylinder-prod-no" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-cylinder-prod-no">
        <button class="cam-btn" onclick="captureSerial('inp-cylinder-prod-no','photo_cylinder_prod')">📷</button>
      </div>
    </div>
    <div class="cell"></div>
  </div>

  <!-- Row: HFM Serial No | (empty) -->
  <div class="card-row">
    <div class="cell">
      <label class="yellow">HFM Serial No</label>
      <div class="serial-row">
        <input type="text" id="inp-hfm-serial" placeholder="Tap 📷" autocapitalize="characters" spellcheck="false">
        <img class="serial-thumb" id="thumb-inp-hfm-serial">
        <button class="cam-btn" onclick="captureSerial('inp-hfm-serial','photo_hfm')">📷</button>
      </div>
    </div>
    <div class="cell"></div>
  </div>

</div><!-- end card-body -->

<div class="ocr-status" id="ocr-status">📷 Tap camera icon next to any serial field to capture</div>

<div class="action-bar">
  <button class="btn btn-primary" onclick="saveIdentityAndContinue()">Save & Continue to Checks →</button>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="js/supabase.js"></script>
<script>
  const formData = JSON.parse(sessionStorage.getItem('bluecard_form') || '{}');
  const operator = sessionStorage.getItem('bluecard_operator') || '—';
  document.getElementById('top-operator').textContent = `OP ${operator}`;

  document.addEventListener('DOMContentLoaded', () => {
    initSupabase();
    populateTrolley();
    populateYear();
    loadCustomers();
    restoreFields();
    initOCR();
  });

  function populateTrolley() {
    const tSel = document.getElementById('inp-trolley-no');
    tSel.innerHTML = '<option value="">— Select —</option>';
    for (let i = 1; i <= 20; i++) tSel.innerHTML += `<option value="${i}">Trolley ${i}</option>`;

    const pSel = document.getElementById('inp-trolley-pos');
    pSel.innerHTML = '<option value="">— Select —</option>';
    for (let i = 1; i <= 56; i++) pSel.innerHTML += `<option value="${i}">Pos ${i}</option>`;

    autoSuggestTrolley();
  }

  async function autoSuggestTrolley() {
    try {
      const { data } = await supabaseClient
        .from('weapon_builds')
        .select('trolley_number, trolley_position')
        .not('trolley_number', 'is', null)
        .order('created_at', { ascending: false })
        .limit(1);

      let t = 1, p = 1;
      if (data && data.length > 0 && data[0].trolley_number) {
        t = data[0].trolley_number;
        p = (data[0].trolley_position || 0) + 1;
        if (p > 56) { t += 1; p = 1; }
        if (t > 20) t = 20;
      }
      document.getElementById('inp-trolley-no').value  = t;
      document.getElementById('inp-trolley-pos').value = p;
    } catch(e) {
      document.getElementById('inp-trolley-no').value  = 1;
      document.getElementById('inp-trolley-pos').value = 1;
    }
  }

  function handleTrolleyChange() {
    document.getElementById('inp-trolley-pos').value = 1;
  }

  function populateYear() {
    const sel = document.getElementById('inp-year');
    sel.innerHTML = '<option value="">— Select —</option>';
    const y = new Date().getFullYear();
    for (let i = y; i <= y + 2; i++) sel.innerHTML += `<option value="${i}">${i}</option>`;
    sel.value = y;
  }

  async function loadCustomers() {
    try {
      const { data } = await supabaseClient.from('weapon_serials').select('customer').order('customer');
      const unique = [...new Set((data || []).map(r => r.customer).filter(Boolean))];
      const sel = document.getElementById('inp-customer');
      sel.innerHTML = '<option value="">— Select —</option>';
      unique.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
      if (formData.client_country) sel.value = formData.client_country;
    } catch(e) { console.warn('Customer load failed', e); }
  }

  function restoreFields() {
    const map = {
      'inp-trolley-no':       'trolley_number',
      'inp-trolley-pos':      'trolley_position',
      'inp-launcher-serial':  'launcher_serial',
      'inp-barrel-no':        'barrel_no',
      'inp-barrel-prod-no':   'barrel_production_no',
      'inp-hrc-serial':       'hrc_serial_no',
      'inp-cylinder-no':      'cylinder_no',
      'inp-firing-mech':      'firing_mech_no',
      'inp-cylinder-prod-no': 'cylinder_production_no',
      'inp-hfm-serial':       'hfm_serial_no',
      'inp-year':             'year_of_manufacture',
      'inp-customer':         'client_country',
    };
    Object.entries(map).forEach(([elId, key]) => {
      const el = document.getElementById(elId);
      if (el && formData[key]) el.value = formData[key];
    });
  }

  function saveIdentityAndContinue() {
    const map = {
      'inp-trolley-no':       'trolley_number',
      'inp-trolley-pos':      'trolley_position',
      'inp-launcher-serial':  'launcher_serial',
      'inp-barrel-no':        'barrel_no',
      'inp-barrel-prod-no':   'barrel_production_no',
      'inp-hrc-serial':       'hrc_serial_no',
      'inp-cylinder-no':      'cylinder_no',
      'inp-firing-mech':      'firing_mech_no',
      'inp-cylinder-prod-no': 'cylinder_production_no',
      'inp-hfm-serial':       'hfm_serial_no',
      'inp-year':             'year_of_manufacture',
      'inp-customer':         'client_country',
    };
    Object.entries(map).forEach(([elId, key]) => {
      const el = document.getElementById(elId);
      if (el) formData[key] = el.value;
    });
    sessionStorage.setItem('bluecard_form', JSON.stringify(formData));
    showToast('Saved ✓', 'ok');
    setTimeout(() => window.location.href = 'index.html', 700);
  }

  // ── OCR + Camera ───────────────────────────────────────────────────
  let tesseractWorker = null;

  async function initOCR() {
    try {
      tesseractWorker = await Tesseract.createWorker('eng');
      await tesseractWorker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ',
      });
      document.getElementById('ocr-status').textContent = '📷 Camera ready — tap icon next to any serial field';
    } catch(e) {
      document.getElementById('ocr-status').textContent = '⚠ OCR not available — type serials manually';
    }
  }

  async function captureSerial(fieldId, photoKey) {
    const input = document.createElement('input');
    input.type    = 'file';
    input.accept  = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    document.body.appendChild(input);

    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) { document.body.removeChild(input); return; }

      const reader = new FileReader();
      reader.onload = async (ev) => {
        const base64 = ev.target.result;
        formData[photoKey] = base64;

        const thumb = document.getElementById(`thumb-${fieldId}`);
        if (thumb) { thumb.src = base64; thumb.style.display = 'block'; }

        const inp = document.getElementById(fieldId);
        if (inp) { inp.placeholder = 'Reading…'; inp.disabled = true; }
        document.getElementById('ocr-status').textContent = '🔍 Reading serial number — please wait…';
        showToast('Reading serial…', 'ok');

        try {
          if (!tesseractWorker) await initOCR();
          const { data } = await tesseractWorker.recognize(base64);
          let text = data.text.trim().toUpperCase().replace(/\n/g,' ').replace(/\s+/g,' ').trim();
          if (inp) {
            inp.value = text;
            inp.disabled = false;
            inp.style.borderBottomColor = '#e08f1a';
            inp.placeholder = 'Confirm or correct';
          }
          document.getElementById('ocr-status').textContent = '✓ Serial read — please confirm or correct the value above';
          showToast('Read done — confirm serial ✓', 'ok');
        } catch(err) {
          if (inp) { inp.disabled = false; inp.placeholder = 'Type manually'; }
          document.getElementById('ocr-status').textContent = '⚠ Could not read — please type serial manually';
          showToast('OCR failed — type manually', 'warn');
        }
      };
      reader.readAsDataURL(file);
      document.body.removeChild(input);
    };
    input.click();
  }

  let toastTimer;
  function showToast(msg, type='ok') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} visible`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('visible'), 3200);
  }
</script>
</body>
</html>
