<!-- ─────────────────────────────────────────────────────────────────────────
  count.html — Component Count on the tablet (v1.0, 31 Oct 2026)
  Lives in the Blue Card repo (bluecardpwa) next to menu.html, behind the
  same site password. LIVE by default; ?env=test uses the TEST database.
  Needs stock_take_counts_31Oct.sql on the database first.

  The camera counts the parts laid out on the tray (OpenCV.js, on the tablet
  itself — nothing is sent away to be counted). The counter checks the
  numbered dots, corrects with − / + and saves. Two kinds of count:

    1. RECEIVING COUNT — an aid while booking a delivery: choose the PO line,
       count, and the number is shown to book in Book Arrival. It is LOGGED
       only (stock_take_counts, mode RECEIVING). It books nothing and Book
       Arrival (receiving.html) is not changed and does not read it.
    2. STOCK TAKE — choose the store and the part, count. The count goes to
       the Stock Count screen on the laptop (Stock → Stock Count), where it is
       Accepted (booked through book_stock_count), Rejected or sent back
       for a Recount. The tablet never changes stock. The count is BLIND:
       the Matrix quantity is not shown here.

  A small proof photo (~80 KB, the numbered dots on it) is kept only for a
  stock take count that differs from Matrix — uploaded in the background
  after the count is saved, so nobody waits for it.
  Who may count: Admin + roles with "Tablet Count" in role_permissions.
──────────────────────────────────────────────────────────────────────────── -->

<style>

  .bar{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--border);

<script>
"use strict";
// ─── ENVIRONMENT ─────────────────────────────────────────────────────────────
// LIVE = the Blue Card connection (js/supabase.js). ?env=test = TEST database
// (same TEST connection as receiving.html).
const CNT_VERSION = "1.0";
const CNT_TEST = /(^|[?&])env=test(&|$)/i.test(location.search);
const CNT_TEST_URL = "https://wtkbsvopuvtxiprjtqqx.supabase.co";
const CNT_TEST_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0a2Jzdm9wdXZ0eGlwcmp0cXF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTUzNjIsImV4cCI6MjA5NjE3MTM2Mn0.q3cRrSbgmgzaw9PzHEuXaic-3Cl-JAiAPVbZnyoY8SQ";
const db = window.__cntDb || window.supabase.createClient(
  CNT_TEST ? CNT_TEST_URL : SUPABASE_URL,
  CNT_TEST ? CNT_TEST_KEY : SUPABASE_ANON_KEY,
  { auth: { persistSession: false, autoRefreshToken: false, storageKey: "cnt-" + (CNT_TEST ? "test" : "live") } });

const PHOTO_BUCKET = "stock-count-photos";
const IDLE_MINUTES = 5;
const CALL_TIMEOUT = window.__cntTimeout || 20000;
// Same stores / products as the Stock Count screen on the laptop (frm_stockview.StockCountView)
const STORES = ["XRGL Store", "GRN40 Store", "RLL Store", "COTS Store", "RLL Legacy Store",
                "M(S)GL Store", "Spares & Accessories Store", "Packaging Store"];
const PRODUCTS = ["All", "XRGL40", "GRN40", "RLL", "RLL Legacy", "M(S)GL"];
const STORE_PRODUCT = { "XRGL Store": "XRGL40", "GRN40 Store": "GRN40", "RLL Store": "RLL",
                        "RLL Legacy Store": "RLL Legacy", "M(S)GL Store": "M(S)GL" };
// Built-in process suffixes (db_manager._BUILTIN_PROCESS_SUFFIXES) — the table
// process_suffixes is read on login and used when it can be read.
let SUFFIXES = new Set(["M","T","XRAY","HT","C","W","BD","ANEAL","ANNEAL","CI","XRAYI","MI","WI","HTI",
  "KITR","KITB","H","F","L","EXT","D","TI","BDI","KIT","KIT2","T1","S","ENG","P","CD"]);

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  screen: "names", users: null, usersErr: "", user: null, pin: "", pinErr: "",
  // stock take
  store: null, product: "All", items: null, itemsErr: "", itemSearch: "", open: {},
  recounts: null, recountsErr: "",
  // receiving
  pos: null, posErr: "", poSearch: "", po: null, lines: null, linesErr: "", dn: "",
  // the count in hand
  job: null,          // {mode, stock_item_id, title, sub, po_number, line_ref, outstanding}
  ref: null, result: null, err: "",
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const $ = (h) => { document.getElementById("app").innerHTML = h; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => Number(v || 0);
const newRef = () => (crypto.randomUUID ? crypto.randomUUID()
  : "c" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const hhmm = (t) => { try { return new Date(t).toLocaleTimeString("en-ZA", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const ddmm = (t) => { try { return new Date(t).toLocaleDateString("en-ZA", { day: "2-digit", month: "2-digit" }); } catch (e) { return ""; } };

function withTimeout(p, ms = CALL_TIMEOUT) {
  return Promise.race([p, new Promise((_, rej) =>
    setTimeout(() => rej(new Error("No answer from the database (Wi-Fi?)")), ms))]);
}
function hasSuffix(code) {          // same rule as db_manager._has_process_suffix
  const sc = String(code || "").trim().toUpperCase();
  if (!sc.includes("_")) return false;
  const toks = sc.split("_").slice(1).join("_").split(/[ _]+/).filter(Boolean);
  return toks.length > 0 && toks.every(t => SUFFIXES.has(t));
}
function header(title, sub, back) {
  return `
    <div class="envbar ${CNT_TEST ? "env-test" : "env-live"}">${CNT_TEST
      ? "⚠ TEST MODE — TEST database — NOT live data"
      : "✓ LIVE — Production database"}</div>
    <header>
      <span class="file">count.html v${CNT_VERSION}</span>
      ${back ? `<button onclick="${back}">${back === "toMenu()" ? "‹ Menu" : "‹ Back"}</button>` : ""}
      <div class="titles"><h1>${esc(title)}</h1><div class="sub">${esc(sub || "")}</div></div>
      ${S.user ? `<div class="who">${esc(S.user.username)}<br><a style="color:#A8C4E0" href="#" onclick="logout();return false">Log out</a></div>` : ""}
    </header>`;
}
function alertMsg(m) {
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const w = document.createElement("div"); w.className = "warn toast";
  w.style.cssText = "position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:50;max-width:90%;box-shadow:0 4px 18px rgba(0,0,0,.2)";
  w.textContent = m; document.body.appendChild(w); setTimeout(() => w.remove(), 4500);
}
async function readAll(build) {     // Supabase sends max 1,000 rows per call — page through
  const out = [];
  for (let start = 0; start < 50000; start += 1000) {
    const { data, error } = await withTimeout(build().range(start, start + 999));
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}

// idle logout (shared tablet)
let idleTimer = null;
function touch() {
  clearTimeout(idleTimer);
  if (S.user && S.screen !== "saving")
    idleTimer = setTimeout(() => logout("Logged out after " + IDLE_MINUTES + " minutes without use."), IDLE_MINUTES * 60000);
}
["pointerdown", "keydown"].forEach(e => document.addEventListener(e, touch, { passive: true }));
function logout(msg) {
  stopCam();
  Object.assign(S, { user: null, pin: "", job: null, screen: "names", pinErr: msg || "" });
  render();
}
function toMenu() { stopCam(); location.href = "menu.html" + (CNT_TEST ? "?env=test" : ""); }

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  if (S.screen !== "camera") stopCam();
  ({ names: rNames, pin: rPin, home: rHome, stores: rStores, items: rItems, recounts: rRecounts,
     pos: rPos, lines: rLines, camera: rCamera, saving: rSaving, unsure: rUnsure, done: rDone })[S.screen]();
}

// 1. who is counting
async function loadUsers() {
  S.users = null; render();
  try {
    const [u, p] = await withTimeout(Promise.all([
      db.from("users").select("username, role").eq("active", true).order("username"),
      db.from("role_permissions").select("role").eq("button_name", "Tablet Count").eq("allowed", true),
    ]));
    if (u.error) throw u.error;
    if (p.error) throw p.error;
    const ok = new Set((p.data || []).map(r => r.role)); ok.add("Admin");
    S.users = (u.data || []).filter(x => ok.has(x.role)); S.usersErr = "";
  } catch (e) { S.users = []; S.usersErr = "Could not load names: " + (e.message || e); }
  render();
}
function rNames() {
  const list = S.users === null ? `<div class="spin">Loading…</div>`
    : S.users.length ? `<div class="names">${S.users.map((u, i) =>
        `<div class="name" onclick="pickUser(${i})">${esc(u.username)}</div>`).join("")}</div>`
    : `<div class="empty">No one may count yet.<br>Give the role “Tablet Count” in Matrix → Admin → Permissions.</div>`;
  $(header("Component Count", "Who is counting?", "toMenu()") + `<main>
      ${S.pinErr ? `<div class="info">${esc(S.pinErr)}</div>` : ""}
      ${S.usersErr ? `<div class="err">${esc(S.usersErr)}<br><br><button class="btn sec" style="width:auto" onclick="loadUsers()">Try again</button></div>` : ""}
      <div class="label">Tap your name</div>${list}</main>`);
}
function pickUser(i) { S.user = { username: S.users[i].username }; S.pin = ""; S.pinErr = ""; S.screen = "pin"; render(); }

// 2. PIN
function rPin() {
  const dots = [0, 1, 2, 3].map(i => `<div class="dot ${i < S.pin.length ? "f" : ""}"></div>`).join("");
  $(header("Component Count", "Enter your Matrix PIN", "S.user=null;S.screen='names';render()") + `<main>
     <div class="pinwrap">
       <div style="font-size:20px;font-weight:700">${esc(S.user.username)}</div>
       <div class="dots">${dots}</div>
       <div class="keys">
         ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" onclick="pinKey('${n}')">${n}</button>`).join("")}
         <button class="key s" onclick="S.pin='';render()">Clear</button>
         <button class="key" onclick="pinKey('0')">0</button>
         <button class="key s" onclick="S.pin=S.pin.slice(0,-1);render()">⌫</button>
       </div>
       <div style="color:var(--red);font-weight:600;margin-top:16px;min-height:22px">${esc(S.pinErr)}</div>
     </div></main>`);
}
async function pinKey(d) {
  if (S.pin.length >= 4) return;
  S.pin += d; S.pinErr = ""; render();
  if (S.pin.length < 4) return;
  try {
    const { data, error } = await withTimeout(db.rpc("tablet_count_login", { p_username: S.user.username, p_pin: S.pin }));
    if (error) throw error;
    if (!data.ok) { S.pin = ""; S.pinErr = "Incorrect PIN — try again."; return render(); }
    if (!data.can_count) { S.pin = ""; S.pinErr = `${data.role} may not count on the tablet.`; return render(); }
    S.user = { username: data.username, role: data.role };
    touch(); loadSuffixes(); goHome();
  } catch (e) { S.pin = ""; S.pinErr = "Could not check the PIN: " + (e.message || e); render(); }
}
async function loadSuffixes() {    // optional — the built-in list stays if this fails
  try {
    const { data, error } = await withTimeout(db.from("process_suffixes").select("suffix, active"));
    if (error) return;
    const act = (data || []).filter(r => r.active && String(r.suffix || "").trim())
                            .map(r => String(r.suffix).trim().toUpperCase());
    if (act.length) SUFFIXES = new Set(act);
  } catch (e) { /* keep built-in */ }
}

// 3. home — which kind of count
async function goHome() {
  S.screen = "home"; S.job = null; render();
  try {        // recount badge
    const { data, error } = await withTimeout(db.from("stock_take_counts")
      .select("id").eq("mode", "STOCK_TAKE").eq("status", "Recount").limit(500));
    if (!error) { S.recountN = (data || []).length; if (S.screen === "home") render(); }
  } catch (e) { /* badge only */ }

// ─── 6. CAMERA + COUNTING ENGINE ─────────────────────────────────────────────
// OpenCV.js (jsDelivr CDN, ~10 MB, cached by the browser after the first time).
// ?cv=<url> overrides (testing only). Loaded when the first count is started.
const CV_URL = new URLSearchParams(location.search).get("cv")
  || "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js";
let cv = null, cvLoading = null;
function loadCv() {
  if (cv) return Promise.resolve(true);      // never the module itself (see below)
  if (cvLoading) return cvLoading;
  cvLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = CV_URL; s.async = true;
    s.onload = async () => {
      try {
        let c = window.cv;
        if (c instanceof Promise) c = await c;
        if (!c.Mat) await new Promise(r => { c.onRuntimeInitialized = r; });
        // NOTE: never resolve() with the OpenCV module itself — it has its own
        // .then(), and handing it to resolve() loops forever (page freezes)
        cv = c; resolve(true);
      } catch (e) { cvLoading = null; reject(e); }
    };
    s.onerror = () => { cvLoading = null; s.remove(); reject(new Error("Could not load the counting engine (Wi-Fi?)")); };
    document.head.appendChild(s);
  });
  return cvLoading;
}

// counting settings stay for the session (same tray, same light)

const C = { stream: null, frame: null, blobs: [], auto: 0, adj: 0, refArea: null, detail: "", shot: false };

async function startCam() {

function stopCam() {
  if (C.stream) { C.stream.getTracks().forEach(t => t.stop()); C.stream = null; }

function grabToCanvas(srcEl, w, h) {
  const sc = Math.min(1, MAX_W / w);
  const c = document.createElement("canvas");
  c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext("2d").drawImage(srcEl, 0, 0, c.width, c.height);
  return c;
}
function frozen() {

function retake() {
  C.frame = null; C.shot = false; C.adj = 0; C.blobs = []; S.ref = null;
  document.getElementById("out").style.display = "none";
  document.getElementById("btnCount").style.display = "block";
  document.getElementById("btnRetake").style.display = "none";

function fromFile(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    C.frame = grabToCanvas(img, img.naturalWidth, img.naturalHeight);
    URL.revokeObjectURL(img.src);
    frozen(); if (cv) runCount();

// 1 grey+blur · 2 Otsu threshold (+ sensitivity) · 3 parts = minority colour ·
// 4 clean-up · 5 outer outlines · 6 one part = median size (or the tapped part) ·
// 7 each blob = round(area / one-part size)
function runCount() {
  if (!cv || !C.frame) return;
  const src = cv.imread(C.frame), gray = new cv.Mat(), bin = new cv.Mat();
  const k3 = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(3, 3));
  const k5 = cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(5, 5));
  const contours = new cv.MatVector(), hier = new cv.Mat();
  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
    const otsu = cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);
    const t = Math.max(1, Math.min(254, otsu + CS.thr));
    let inv;
    if (CS.pol === "dark") inv = true;
    else if (CS.pol === "light") inv = false;
    else { cv.threshold(gray, bin, t, 255, cv.THRESH_BINARY); inv = cv.countNonZero(bin) > bin.rows * bin.cols / 2; }
    cv.threshold(gray, bin, t, 255, inv ? cv.THRESH_BINARY_INV : cv.THRESH_BINARY);
    cv.morphologyEx(bin, bin, cv.MORPH_OPEN, k3);
    cv.morphologyEx(bin, bin, cv.MORPH_CLOSE, k5);
    cv.findContours(bin, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    const W = bin.cols, H = bin.rows, noise = W * H * 0.00003;
    const blobs = [];
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i), a = cv.contourArea(c), r = cv.boundingRect(c);
      if (a >= noise) {
        const edge = r.x <= 1 || r.y <= 1 || r.x + r.width >= W - 1 || r.y + r.height >= H - 1;
        if (!(CS.edge && edge)) { const m = cv.moments(c); blobs.push({ a, r, cx: m.m10 / m.m00, cy: m.m01 / m.m00 }); }
      }
      c.delete();
    }
    const sizes = blobs.map(b => b.a).sort((x, y) => x - y);
    const big = sizes.filter(a => a >= (sizes[sizes.length - 1] || 0) * 0.02);
    const ref = C.refArea || (big.length ? big[Math.floor(big.length / 2)] : 0);
    let total = 0, multi = 0, ignored = 0;
    blobs.forEach(b => {
      b.n = b.a < ref * CS.minp / 100 ? 0 : Math.max(1, Math.round(b.a / ref));
      total += b.n; if (b.n > 1) multi++; if (!b.n) ignored++;
    });
    blobs.sort((p, q) => (Math.round(p.cy / 40) - Math.round(q.cy / 40)) || (p.cx - q.cx));
    C.blobs = blobs; C.auto = total;
    C.detail = `${blobs.length - ignored} part shapes found` +
      (multi ? ` · <b style="color:#E65100">${multi} counted as 2+ — check</b>` : "") +
      (ignored ? ` · ${ignored} too small, ignored` : "") + (C.refArea ? " · size set by tap" : "");
    draw(); showCount();
  } finally {
    src.delete(); gray.delete(); bin.delete(); k3.delete(); k5.delete(); contours.delete(); hier.delete();
  }
}
function draw() {
  const f = C.frame, out = document.getElementById("out"); if (!out) return;
  out.width = f.width; out.height = f.height;
  const g = out.getContext("2d");
  g.drawImage(f, 0, 0);
  const R = Math.max(10, Math.round(f.width / 70));
  let n = 0;
  g.textAlign = "center"; g.textBaseline = "middle";
  C.blobs.forEach(b => {
    const col = b.n === 0 ? "#9E9E9E" : b.n > 1 ? "#E65100" : "#2E7D32";
    g.lineWidth = 2; g.strokeStyle = col; g.strokeRect(b.r.x, b.r.y, b.r.width, b.r.height);
    g.beginPath(); g.arc(b.cx, b.cy, R, 0, Math.PI * 2); g.fillStyle = col; g.fill();
    g.lineWidth = 2; g.strokeStyle = "#fff"; g.stroke();
    g.fillStyle = "#fff"; g.font = `bold ${Math.round(R * (b.n > 1 ? 0.9 : 1.05))}px Arial`;
    if (b.n === 0) g.fillText("×", b.cx, b.cy);
    else { n += b.n; g.fillText(b.n > 1 ? "×" + b.n : String(n), b.cx, b.cy); }
  });
  out.style.display = "block";
}
const finalCount = () => Math.max(0, C.auto + C.adj);
function showCount() {
  const el = document.getElementById("count"); if (!el) return;
  if (!C.frame || !cv) { el.textContent = "–"; return; }
  el.textContent = finalCount();
  document.getElementById("detail").innerHTML = (C.detail || "") +
    (C.adj ? ` · <b>${C.adj > 0 ? "+" : ""}${C.adj} by hand</b>` : "");
  document.getElementById("btnSave").disabled = false;
}
function adjust(d) { if (!C.frame || !cv) return; C.adj += d; showCount(); }
function tapPart(ev) {
  if (!C.blobs.length) return;
  const out = ev.currentTarget, rc = out.getBoundingClientRect();
  const x = (ev.clientX - rc.left) * out.width / rc.width, y = (ev.clientY - rc.top) * out.height / rc.height;
  const hit = C.blobs.find(b => x >= b.r.x && x <= b.r.x + b.r.width && y >= b.r.y && y <= b.r.y + b.r.height);
  if (hit) { C.refArea = hit.a; C.adj = 0; runCount(); }
}

// ─── 7. SAVE — one database call; safe to repeat (same reference = not saved twice)
async function saveCount() {
  if (!C.frame || !S.ref) return;
  const j = S.job, counted = finalCount();
  if (j.mode === "RECEIVING" && counted > j.outstanding &&
      !confirm(`${counted} counted but only ${j.outstanding} outstanding on this line.\n\nSave the count anyway? (More than ordered is booked on the laptop.)`)) return;
  // the proof photo is made now, before the screen changes
  j.photo = await photoBlob().catch(() => null);
  j.counted = counted; j.camera = C.auto;
  submitCount();
}
async function submitCount() {
  const j = S.job;
  S.screen = "saving"; render();
  try {
    const { data, error } = await withTimeout(db.rpc("tablet_save_count", {
      p_username: S.user.username, p_pin: S.pin, p_mode: j.mode,
      p_stock_item_id: j.stock_item_id || null, p_po_number: j.po_number || null,
      p_line_ref: j.line_ref || null, p_delivery_note: j.mode === "RECEIVING" ? S.dn.trim() : null,
      p_counted: j.counted, p_camera: j.camera, p_client_ref: S.ref }), CALL_TIMEOUT * 1.5);
    if (error) throw error;
    if (!data.ok) { S.err = data.error || "Not saved."; S.screen = "unsure"; S.notSaved = true; return render(); }
    S.result = data; S.screen = "done"; render();
    if (data.want_photo && j.photo) uploadPhoto(data.id, j.photo);   // background — nobody waits
  } catch (e) { S.err = String(e.message || e); S.notSaved = false; S.screen = "unsure"; render(); }
}
function photoBlob() {      // ~1024 px JPEG of the counted photo with the dots (~60–100 KB)
  return new Promise((resolve, reject) => {
    const out = document.getElementById("out"); if (!out || !out.width) return resolve(null);
    const sc = Math.min(1, 1024 / out.width);
    const c = document.createElement("canvas");
    c.width = Math.round(out.width * sc); c.height = Math.round(out.height * sc);
    c.getContext("2d").drawImage(out, 0, 0, c.width, c.height);
    c.toBlob(b => b ? resolve(b) : reject(new Error("no photo")), "image/jpeg", 0.7);
  });
}
async function uploadPhoto(id, blob) {
  try {
    const d = new Date();
    const path = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${id}.jpg`;
    const up = await withTimeout(db.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: false }), 60000);
    if (up.error && !/exists|duplicate/i.test(up.error.message || "")) throw up.error;
    await withTimeout(db.rpc("tablet_count_photo", { p_username: S.user ? S.user.username : "", p_pin: S.pin, p_id: id, p_path: path }));
  } catch (e) { console.warn("[count] photo not uploaded:", e); }   // the count itself is saved
}
function rSaving() { $(header("Saving…", S.job.title) + `<div class="spin">⏳ Saving the count — please wait…</div>`); }
function rUnsure() {
  $(header(S.notSaved ? "Not saved" : "Not confirmed", S.job.title) + `<main>
    ${S.notSaved ? `<div class="err"><b>The count was NOT saved.</b>\n${esc(S.err)}</div>`
      : `<div class="warn"><b>The tablet did not get an answer.</b>\n${esc(S.err)}\n
The count may or may not have been saved. Tap “Try again” — if it was already saved
it will NOT be saved a second time.</div>`}
    </main><div class="bar"><div class="inner">
      <button class="btn sec" onclick="S.screen='camera';render();startCam()">Back to the count</button>
      ${S.notSaved ? "" : `<button class="btn go" onclick="submitCount()">Try again</button>`}</div></div>`);
}
function rDone() {
  const j = S.job, r = S.result;
  if (j.mode === "RECEIVING") {
    const diff = j.counted - j.outstanding;
    $(header("Count logged", j.sub) + `<main><div class="done">
      <div style="font-size:18px;color:var(--muted)">${esc(j.title)}</div>
      <div class="bookit">${j.counted}</div>
      <div style="font-size:18px">Book <b>${j.counted}</b> for line ${esc(j.line_ref)} in <b>Book Arrival</b>.</div>
      <div style="color:var(--muted);margin-top:8px">Outstanding on the line: ${j.outstanding}${
        diff < 0 ? ` · <b style="color:var(--amber)">${-diff} short</b>` : diff > 0 ? ` · <b style="color:var(--red)">${diff} more than outstanding</b>` : " · complete"}</div>
      <div style="color:var(--muted);margin-top:14px">${r.duplicate ? "This count was already saved — not saved twice. " : ""}The count is logged only; nothing is booked here.</div>
    </div></main>
    <div class="bar"><div class="inner">
      <button class="btn sec" onclick="goHome()">Done</button>
      <button class="btn go" onclick="S.screen='lines';render()">Count another line</button></div></div>`);
  } else {
    $(header("Count saved", j.sub) + `<main><div class="done">
      <div class="tickbig">✓</div>
      <div style="font-size:18px;color:var(--muted)">${esc(j.title)}</div>
      <div class="bookit">${j.counted}</div>
      <div style="color:var(--muted);font-size:16px">${r.duplicate ? "This count was already saved — not saved twice.<br>" : ""}
        Sent to the Stock Count on the laptop for the floor manager to accept.</div>
    </div></main>
    <div class="bar"><div class="inner">
      <button class="btn sec" onclick="goHome()">Done</button>
      <button class="btn go" onclick="${j.back.startsWith("openRecounts") ? "openRecounts()" : "nextItem()"}">Count the next part</button></div></div>`);
    // mark it on the list without reloading
    if (S.items && j.stock_item_id) S.open[j.stock_item_id] = { status: "Counted", counted_at: new Date().toISOString(), counted_by: S.user.username };
  }
}
function nextItem() { S.screen = "items"; render(); }

loadUsers();
</script>
